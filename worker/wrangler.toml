name = "offcampus-photos"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
# Tokens are only accepted if they were issued by Firebase Auth for THIS project.
FIREBASE_PROJECT_ID = "offcampus-5f370"

# PHOTOS is the KV namespace the profile photos live in. Create your own once with
#   npx wrangler kv namespace create PHOTOS
# and paste the id it prints below (see worker/README.md). `wrangler dev` ignores the id and uses a
# local simulated store, so this placeholder is fine for local testing.
[[kv_namespaces]]
binding = "PHOTOS"
id = "eb92e3e3d738454cb0e774ece849b846"
